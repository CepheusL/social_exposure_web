<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patterns — Unpacking Social Exposure</title>
  <meta name="description" content="A country map and an industry-by-year heatmap of social exposure on earnings calls, 2003–2024.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Patterns — Unpacking Social Exposure">
  <meta property="og:description" content="Where and when firms talk about social topics: every country and industry, 2003–2024.">
  <meta property="og:image" content="og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <div class="page-wrapper no-sidebar">
    <main class="main-content" id="main">
      <p class="page-eyebrow">Patterns</p>
      <h1>Where and when</h1>
      <p class="subtitle">Every country and industry at a glance. Darker cells mean more social exposure. Click any tile or cell to open its trend.</p>

      <div class="view-controls" role="group" aria-label="Map and heatmap options">
        <div class="ctrl"><label class="ctrl-label" for="ctrl-measure">Measure</label><select id="ctrl-measure"></select></div>
        <div class="ctrl"><label class="ctrl-label" for="ctrl-stat">Statistic</label><select id="ctrl-stat"></select></div>
        <div class="ctrl-spacer"></div>
        <div class="legend-scale" id="legend"></div>
      </div>

      <section class="chart-card" id="map-card" aria-labelledby="map-title">
        <div class="chart-head">
          <div>
            <h2 class="chart-title" id="map-title">Countries</h2>
            <p class="chart-sub" id="map-sub"></p>
          </div>
        </div>
        <div class="map-controls">
          <button type="button" class="play-btn" id="play" aria-label="Play through the years">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path id="play-icon" d="M3 1.5v11l9-5.5z" fill="#141413"/></svg>
          </button>
          <span class="map-year" id="map-year" aria-live="polite">2024</span>
          <label class="sr-only" for="year-slider">Year</label>
          <input type="range" id="year-slider" step="1">
        </div>
        <div class="tilemap-wrap"><div class="tilemap" id="tilemap" role="group" aria-label="Country tile map"></div></div>
        <div class="chart-foot"><p class="chart-caption" id="map-caption"></p></div>
      </section>

      <section class="chart-card" id="heatmap" aria-labelledby="hm-title">
        <div class="chart-head">
          <div>
            <h2 class="chart-title" id="hm-title">Industries × years</h2>
            <p class="chart-sub" id="hm-sub"></p>
          </div>
        </div>
        <div class="map-controls" style="padding-bottom:6px">
          <div class="ctrl"><span class="ctrl-label">Rows</span><div id="ctrl-rows"></div></div>
          <div class="ctrl"><label class="ctrl-label" for="ctrl-sort">Sort</label>
            <select id="ctrl-sort" style="width:auto;height:32px;font-size:.8rem">
              <option value="latest">By latest year</option>
              <option value="change">By change since first year</option>
              <option value="name">By name</option>
            </select>
          </div>
        </div>
        <div class="heatmap-wrap"><div class="heatmap" id="heatmap-grid" role="grid" aria-label="Heatmap"></div></div>
        <div class="chart-foot"><p class="chart-caption" id="hm-caption"></p></div>
      </section>
    </main>
  </div>

  <div class="viz-tip" id="viz-tip" role="tooltip"></div>
  <div id="site-footer"></div>

  <script src="lib/chart.umd.min.js"></script>
  <script src="js/app.js?v=9"></script>
  <script src="js/charts.js?v=9"></script>
  <script src="js/patterns.js?v=9"></script>
</body>
</html>
