<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore | Firm-Level Climate Change Exposure</title>
  <meta name="description" content="Climate change exposure, risk and sentiment on earnings calls over time, for all firms or any country, industry or firm, 2001Q1–2024Q4.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Explore trends | Firm-Level Climate Change Exposure">
  <meta property="og:description" content="Trends in how firms discuss climate change on their earnings calls, by country, industry and firm.">
  <meta property="og:image" content="og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../favicon-climate.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=19">
</head>
<body data-section="climate">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <div class="page-wrapper">
    <aside class="sidebar" id="sidebar" aria-label="Filters">
      <div class="filter-group">
        <span class="filter-label" id="scope-label">Scope</span>
        <div id="scope-ctrl"></div>
      </div>
      <div class="filter-group" id="entity-group" hidden>
        <label class="filter-label" for="entity-input" id="entity-label">Country</label>
        <div class="chip-row" id="entity-chip"></div>
        <div class="combo">
          <input type="search" id="entity-input" placeholder="Search…">
          <div class="dropdown-list" id="entity-list"></div>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Topics</span>
        <div class="measure-list" id="measure-list"></div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Years</span>
        <div id="year-ctrl"></div>
      </div>
      <div class="filter-actions">
        <a class="btn btn-sm" href="explore.html">Reset</a>
        <button type="button" class="btn btn-sm" id="copy-link">Copy link</button>
      </div>
    </aside>

    <main class="main-content" id="main">
      <p class="page-eyebrow">Time trends</p>
      <h1>Explore</h1>
      <p class="subtitle">Track climate change talk over time for all firms, a country, an industry or one firm. Pick a topic, then exposure, risk or sentiment.</p>

      <div id="notice"></div>

      <div class="view-controls" role="group" aria-label="Chart options">
        <div class="ctrl"><label class="ctrl-label" for="ctrl-metric">Metric</label><select id="ctrl-metric"></select></div>
        <div class="ctrl"><label class="ctrl-label" for="ctrl-stat">Statistic</label><select id="ctrl-stat"></select></div>
        <div class="ctrl"><span class="ctrl-label">Frequency</span><div id="ctrl-freq"></div></div>
        <div class="ctrl"><span class="ctrl-label">View</span><div id="ctrl-view"></div></div>
        <div class="ctrl"><label class="ctrl-label" for="ctrl-scale">Scale</label>
          <select id="ctrl-scale">
            <option value="level">Level</option>
            <option value="yoy">Change from a year earlier</option>
          </select>
        </div>
        <label class="switch" id="peers-wrap"><input type="checkbox" id="ctrl-peers"> Compare with peers</label>
      </div>

      <figure class="chart-card" id="card-main">
        <div class="chart-head">
          <div>
            <h2 class="chart-title" id="chart-title">All firms</h2>
            <p class="chart-sub" id="chart-sub"></p>
          </div>
          <div class="chart-tools"></div>
        </div>
        <div class="chart-body" id="chart-body" style="height:430px"><canvas id="explore-chart"></canvas></div>
        <figcaption class="chart-foot">
          <p class="chart-caption" id="chart-caption"></p>
          <button class="link-btn table-toggle" type="button">View as table</button>
        </figcaption>
        <div class="chart-table" hidden></div>
      </figure>

      <div class="coverage-card" id="coverage-card">
        <h3>Firms in sample</h3>
        <div class="chart-body"><canvas id="coverage-chart"></canvas></div>
      </div>
    </main>
  </div>

  <button class="drawer-toggle" id="drawer-toggle" type="button">Filters</button>
  <div id="site-footer"></div>

  <script src="../lib/chart.umd.min.js"></script>
  <script src="../js/app.js?v=19"></script>
  <script src="../js/charts.js?v=19"></script>
  <script src="../js/climate/explore.js?v=19"></script>
</body>
</html>
